# =====================================================================
# slam_params.yaml  —  SLAM Toolbox parameters (online_async mode)
# ---------------------------------------------------------------------
# Used by launch/slam_online_async.launch.py.
# Tune for a 360-deg LiDAR at ~0.05 m resolution in a ~10 m x 8 m lab.
# =====================================================================
slam_toolbox:
  ros__parameters:

    # --- Solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_problem_report: false

    # --- Map ---
    resolution: 0.05                  # 5 cm/pixel
    max_laser_range: 12.0            # match the LiDAR maxRange in lab_world.wbt
    minimum_time_distance: 0.5       # min seconds between keyframes
    map_update_interval: 1.0         # seconds

    # --- Loop closure ---
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 3
    loop_match_minimum_reward_score: 0.5
    do_loop_closing: true

    # --- Scan processing ---
    scan_buffer_size: 10000
    scan_buffer_maximum_scan_distance: 12.0
    minimum_travel_distance: 0.3     # min robot motion before a new keyframe
    minimum_travel_heading: 0.3      # radians

    # --- Particle filter / mapping ---
    map_start_x: 0.0
    map_start_y: 0.0
    map_start_angle: 0.0

    # --- Topics (defaults) ---
    scan_topic: /scan
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    use_sim_time: true
    debug_logging: false
